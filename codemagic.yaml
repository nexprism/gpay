workflows:
  # =========================================================================
  # 1. Debug APK Workflow (Ready out-of-the-box, no keystore signing needed)
  # =========================================================================
  android-apk-debug:
    name: Build Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web application
        script: |
          node build.js

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Accept Android SDK licenses & check components
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        script: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GooglePlay-app.apk
    artifacts:
      - GooglePlay-app.apk
      - android/app/build/outputs/apk/**/*.apk

  # =========================================================================
  # 2. Release APK Workflow (For production / signing)
  # =========================================================================
  android-apk-release:
    name: Build Android Release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 20
      java: 21
      groups:
        - keystore_credentials
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - node_modules
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web application
        script: |
          node build.js

      - name: Sync Capacitor Android
        script: |
          npx cap sync android

      - name: Accept Android SDK licenses & check components
        script: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Set up keystore (if configured in Codemagic)
        script: |
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > /tmp/keystore.keystore
            cat <<EOF > android/key.properties
            storePassword=$CM_KEYSTORE_PASSWORD
            keyPassword=$CM_KEY_PASSWORD
            keyAlias=$CM_KEY_ALIAS
            storeFile=/tmp/keystore.keystore
          EOF
            echo "Keystore credentials configured."
          else
            echo "No keystore provided, building release APK."
          fi

      - name: Build Android Release APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
      - android/app/build/outputs/bundle/**/*.aab
